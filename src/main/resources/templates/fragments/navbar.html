<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<header th:fragment="header(activeTab)" class="navbar">
    <div class="navbar-inner">
        <!-- Brand Logo -->
        <a th:href="${isAdmin} ? '/home' : '/products'" class="brand-link">
            <div class="brand-badge-icon">
                <svg viewBox="0 0 24 24">
                    <path d="M20 8h-3V6c0-2.8-2.2-5-5-5S7 3.2 7 6v2H4c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM9 6c0-1.7 1.3-3 3-3s3 1.3 3 3v2H9V6zm11 14H4V10h16v10zm-8-3c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2z"/>
                </svg>
            </div>
            <div>
                <span class="brand-title">KhoHang Pro</span>
                <span class="brand-tag">Spring 2</span>
            </div>
        </a>

        <!-- Menu links for ADMIN -->
        <ul class="nav-links" th:if="${isAdmin != null and isAdmin}">
            <li>
                <a href="/home" class="nav-link" th:classappend="${activeTab == 'home'} ? 'active' : ''">
                    <svg viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
                    <span>Tổng quan</span>
                </a>
            </li>
            <li>
                <a href="/admin/inventory" class="nav-link" th:classappend="${activeTab == 'inventory'} ? 'active' : ''">
                    <svg viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H8V4h12v12z"/></svg>
                    <span>Quản lý kho</span>
                </a>
            </li>
            <li>
                <a href="/admin/products" class="nav-link" th:classappend="${activeTab == 'products'} ? 'active' : ''">
                    <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14zM12 7h-2v4H6v2h4v4h2v-4h4v-2h-4z"/></svg>
                    <span>Sản phẩm</span>
                </a>
            </li>
            <li>
                <a href="/admin/orders" class="nav-link" th:classappend="${activeTab == 'orders'} ? 'active' : ''">
                    <svg viewBox="0 0 24 24"><path d="M19 3h-4.18C14.4 1.84 13.3 1 12 1c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm2 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
                    <span>Đơn hàng</span>
                </a>
            </li>
            <li>
                <a href="/admin/logs" class="nav-link" th:classappend="${activeTab == 'logs'} ? 'active' : ''">
                    <svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
                    <span>Nhật ký AOP</span>
                </a>
            </li>
        </ul>

        <!-- Menu links for CUSTOMER -->
        <ul class="nav-links" th:if="${isAdmin == null or !isAdmin}">
            <li>
                <a href="/products" class="nav-link" th:classappend="${activeTab == 'products'} ? 'active' : ''">
                    <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
                    <span>Danh mục sản phẩm</span>
                </a>
            </li>
            <li>
                <a href="/orders/checkout" class="nav-link" th:classappend="${activeTab == 'checkout'} ? 'active' : ''">
                    <svg viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg>
                    <span>Đặt hàng</span>
                </a>
            </li>
            <li>
                <a href="/customer/orders" class="nav-link" th:classappend="${activeTab == 'myorders'} ? 'active' : ''">
                    <svg viewBox="0 0 24 24"><path d="M19 3h-4.18C14.4 1.84 13.3 1 12 1c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm2 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
                    <span>Đơn hàng của tôi</span>
                </a>
            </li>
        </ul>

        <!-- User profile & Logout -->
        <div class="navbar-user">
            <div class="user-pill">
                <div class="user-avatar-circle" th:text="${username != null ? #strings.substring(username, 0, 1).toUpperCase() : 'U'}">U</div>
                <span class="user-name-text" th:text="${username != null ? username : 'User'}">admin</span>
                <span class="role-tag" th:classappend="${isAdmin != null and isAdmin} ? 'admin' : 'customer'" th:text="${isAdmin != null and isAdmin ? 'ADMIN' : 'CUSTOMER'}">ROLE</span>
            </div>

            <form th:action="@{/logout}" method="post" style="margin: 0;">
                <button type="submit" class="btn-logout" title="Đăng xuất">
                    <svg viewBox="0 0 24 24"><path d="M10.09 15.59L11.5 17l5-5-5-5-1.41 1.41L12.67 11H3v2h9.67l-2.58 2.59zM19 3H5c-1.11 0-2 .9-2 2v4h2V5h14v14H5v-4H3v4c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/></svg>
                </button>
            </form>
        </div>
    </div>
</header>

</body>
</html>
