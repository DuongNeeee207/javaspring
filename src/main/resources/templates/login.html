<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Đăng nhập - Quản lý kho hàng</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/login.css}">

</head>

<body>

<div class="login-box">

    <!-- Icon -->
    <div class="login-icon">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M20 8h-3V6c0-2.8-2.2-5-5-5S7 3.2 7 6v2H4c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM9 6c0-1.7 1.3-3 3-3s3 1.3 3 3v2H9V6zm11 14H4V10h16v10zm-8-3c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2z"/>
        </svg>
    </div>

    <h1>Đăng nhập</h1>

    <p>Hệ thống quản lý kho hàng</p>

    <!-- Error message -->
    <div class="alert alert-error" th:if="${param.error}">
        ⚠ Sai tên đăng nhập hoặc mật khẩu
    </div>

    <!-- Logout message - dòng nhỏ dưới subtitle -->
    <p class="logout-msg" th:if="${param.logout}">
        Bạn đã đăng xuất thành công
    </p>

    <form th:action="@{/login}" method="post">

        <div class="form-group">
            <label>Tên đăng nhập</label>
            <input
                type="text"
                name="username"
                placeholder="Nhập tên đăng nhập"
                autocomplete="username"
                required
            >
        </div>

        <div class="form-group">
            <label>Mật khẩu</label>
            <input
                type="password"
                name="password"
                placeholder="Nhập mật khẩu"
                autocomplete="current-password"
                required
            >
        </div>

        <button type="submit" class="btn-login">
            ĐĂNG NHẬP
        </button>

    </form>

    <!-- Divider -->
    <div class="divider">
        <span>hoặc</span>
    </div>

    <!-- Google OAuth2 -->
    <a href="/oauth2/authorization/google" class="btn-google">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Đăng nhập bằng Google
    </a>
    <!-- Demo Accounts Quick Fill -->
    <div style="margin-top: 24px; padding-top: 18px; border-top: 1px solid rgba(255,255,255,0.1); font-size: 12px; color: rgba(255,255,255,0.7); text-align: center;">
        <div style="margin-bottom: 8px; font-weight: 500;">Tài khoản kiểm thử demo:</div>
        <div style="display: flex; gap: 8px; justify-content: center;">
            <button type="button" onclick="fillAccount('admin', '123456')" style="background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 11px;">
                Admin: admin / 123456
            </button>
            <button type="button" onclick="fillAccount('customer', '123456')" style="background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 11px;">
                Khách: customer / 123456
            </button>
        </div>
    </div>

</div>

<script>
    function fillAccount(u, p) {
        document.querySelector('input[name="username"]').value = u;
        document.querySelector('input[name="password"]').value = p;
    }
</script>

</body>

</html>
